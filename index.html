<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Retail Empire Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout idea: a store back-office: sticky clock bar, side ledger of screens, dense tables with price-tag accents */
  --bg:#edf0f3; --panel:#ffffff; --panel2:#f6f8fa; --ink:#15202b; --muted:#5b6876; --line:#d5dce3;
  --accent:#1f5bd1; --accent-ink:#ffffff; --tag:#f3c623; --tag-ink:#2a2200;
  --good:#16804a; --warn:#a86a00; --bad:#c2352a;
  --grocery:#2f8a57; --clothing:#b0427a; --toy:#cf7a22; --book:#4c58b5;
  --display:'Archivo', 'Arial Narrow', system-ui, sans-serif; --body:'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif; --mono:'IBM Plex Mono', ui-monospace, Menlo, monospace;
  --r:8px; --shadow:0 1px 2px rgba(20,30,45,.06),0 4px 16px rgba(20,30,45,.06);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1319; --panel:#161d26; --panel2:#1b242f; --ink:#e5ebf1; --muted:#93a1af; --line:#2a3644;
  --accent:#6f9dff; --accent-ink:#0b1424; --tag:#f3c623; --tag-ink:#2a2200; --good:#45c07c; --warn:#e3a43a; --bad:#ff7a6e;
  --grocery:#5cc58a; --clothing:#e57bb0; --toy:#f0a057; --book:#8f9af0; --shadow:none; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0e1319; --panel:#161d26; --panel2:#1b242f; --ink:#e5ebf1; --muted:#93a1af; --line:#2a3644;
  --accent:#6f9dff; --accent-ink:#0b1424; --tag:#f3c623; --tag-ink:#2a2200; --good:#45c07c; --warn:#e3a43a; --bad:#ff7a6e;
  --grocery:#5cc58a; --clothing:#e57bb0; --toy:#f0a057; --book:#8f9af0; --shadow:none; color-scheme:dark;}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:24px;font-weight:800} h2{font-size:17px;font-weight:700} h3{font-size:14px;font-weight:700}
.num,td.n,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;flex-direction:column;min-width:0;flex:1 1 160px}
.brand b{font-family:var(--display);font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{color:var(--muted);font-size:12px}
.clock{display:flex;flex-direction:column;align-items:flex-end;line-height:1.2}
.clock .t{font-family:var(--mono);font-size:20px;font-weight:600}
.clock .d{font-size:12px;color:var(--muted)}
.speed{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--panel2)}
.speed button{border:0;background:transparent;padding:6px 11px;cursor:pointer;font-family:var(--mono);font-size:13px;min-width:38px}
.speed button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.cashbox{font-family:var(--mono);font-weight:600;font-size:15px;padding:5px 10px;border-radius:6px;background:var(--tag);color:var(--tag-ink);white-space:nowrap}
.cashbox.neg{background:var(--bad);color:#fff}
.iconbtn{border:1px solid var(--line);background:var(--panel2);border-radius:8px;height:36px;min-width:36px;padding:0 8px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;position:relative}
.iconbtn svg{width:18px;height:18px}
.dot{position:absolute;top:-5px;right:-5px;background:var(--bad);color:#fff;font-size:10px;font-weight:700;border-radius:999px;padding:1px 5px;font-family:var(--mono)}
#menuBtn{display:none}
.qbtn{font-weight:600}

/* shell */
.shell{display:grid;grid-template-columns:232px 1fr;min-height:calc(100% - 58px)}
nav.side{background:var(--panel);border-right:1px solid var(--line);padding:12px 10px 40px;position:sticky;top:58px;align-self:start;height:calc(100vh - 58px);overflow:auto}
.side .grp{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:14px 8px 6px;font-weight:600}
.side button.nv{display:flex;width:100%;align-items:center;justify-content:space-between;gap:8px;border:0;background:transparent;text-align:left;padding:7px 10px;border-radius:6px;cursor:pointer;color:var(--ink)}
.side button.nv:hover{background:var(--panel2)}
.side button.nv[aria-current="page"]{background:var(--ink);color:var(--panel);font-weight:600}
.side .badge{font-family:var(--mono);font-size:11px;background:var(--bad);color:#fff;border-radius:999px;padding:0 6px}
.side select{width:100%;margin:2px 0 4px;padding:7px;border:1px solid var(--line);border-radius:6px;background:var(--panel2)}
main{padding:20px 24px 80px;min-width:0;max-width:1240px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.ph p{margin:4px 0 0;color:var(--muted);max-width:65ch}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);min-width:0}
.card h2,.card h3{margin-bottom:8px}
.card.flat{box-shadow:none}
.stack{display:flex;flex-direction:column;gap:12px}
.tile .k{font-size:12px;color:var(--muted)}
.tile .v{font-family:var(--mono);font-size:22px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
.tile .s{font-size:12px;color:var(--muted);margin-top:2px}
.pos{color:var(--good)} .negc{color:var(--bad)}
.muted{color:var(--muted)} .small{font-size:12px}
.mt{margin-top:16px} .mt8{margin-top:8px}
hr{border:0;border-top:1px solid var(--line);margin:12px 0}

/* buttons, inputs */
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:7px 12px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.big{padding:11px 18px;font-size:15px}
.btn:disabled{opacity:.45;cursor:not-allowed}
input[type=text],input[type=number],select,textarea{border:1px solid var(--line);background:var(--panel2);border-radius:6px;padding:6px 8px;min-width:0}
input.qty{width:64px;font-family:var(--mono);text-align:right}
input.price{width:84px;font-family:var(--mono);text-align:right}
textarea{width:100%;font-family:var(--mono);font-size:11px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
label.f input,label.f select{font-size:14px;color:var(--ink)}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px}
.seg button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 10px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}

/* pills */
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;border-radius:999px;padding:2px 8px;background:var(--panel2);border:1px solid var(--line);white-space:nowrap}
.pill.good{color:var(--good);border-color:color-mix(in srgb,var(--good) 40%,var(--line))}
.pill.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
.pill.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.pill.info{color:var(--accent)}
.tchip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600}
.tchip i{width:10px;height:10px;border-radius:3px;display:inline-block;background:var(--c)}
.pricetag{font-family:var(--mono);background:var(--tag);color:var(--tag-ink);padding:1px 6px;border-radius:3px;font-weight:600;font-size:12px}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--panel2);white-space:nowrap;position:sticky;top:0}
td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td:first-child{min-width:150px}
td.n,th.n{text-align:right;white-space:nowrap}
tr.click{cursor:pointer} tr.click:hover td{background:var(--panel2)}
tr.sub td{background:var(--panel2)}
td .nm{font-weight:600} td .sb{font-size:12px;color:var(--muted)}

/* meters */
.meter{height:8px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;overflow:hidden;min-width:60px}
.meter>i{display:block;height:100%;background:var(--accent);border-radius:999px}
.meter.good>i{background:var(--good)} .meter.warn>i{background:var(--warn)} .meter.bad>i{background:var(--bad)}
.stars{color:var(--tag);letter-spacing:1px;font-size:14px}
.stars .off{color:var(--line)}

/* list items */
.li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.alert{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:6px;background:var(--panel2);border-left:3px solid var(--accent);font-size:13px}
.alert.warn{border-left-color:var(--warn)} .alert.bad{border-left-color:var(--bad)} .alert.good{border-left-color:var(--good)}
.empty{padding:18px;text-align:center;color:var(--muted)}

/* queue */
.qcard{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.qcard.busy{opacity:.65}

/* modal */
#modal{position:fixed;inset:0;z-index:50;display:none;background:rgba(10,16,24,.5);padding:24px;overflow:auto}
#modal.on{display:flex;align-items:flex-start;justify-content:center}
.dlg{background:var(--panel);border-radius:12px;width:min(760px,100%);border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.25);margin:auto 0}
.dlg.wide{width:min(1000px,100%)}
.dlg.narrow{width:min(460px,100%)}
.dlg header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.dlg header p{margin:4px 0 0;color:var(--muted);font-size:13px}
.dlg .bd{padding:16px 18px;max-height:calc(100vh - 220px);overflow:auto}
.dlg footer{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}
.receipt{font-family:var(--mono);font-size:13px;background:var(--panel2);border:1px dashed var(--line);border-radius:6px;padding:10px 12px}
.receipt .ln{display:flex;justify-content:space-between;gap:12px;padding:2px 0}
.receipt .tot{border-top:1px dashed var(--muted);margin-top:6px;padding-top:6px;font-weight:700;font-size:15px}
.err{color:var(--bad);font-size:13px;min-height:18px}

/* toasts */
#toasts{position:fixed;right:16px;top:72px;z-index:60;pointer-events:none;display:flex;flex-direction:column;gap:8px;max-width:min(380px,calc(100% - 32px))}
.toast{background:var(--ink);color:var(--panel);padding:10px 14px;border-radius:8px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.2);border-left:4px solid var(--accent)}
.toast.warn{border-left-color:var(--tag)} .toast.bad{border-left-color:var(--bad)} .toast.good{border-left-color:var(--good)}

/* setup */
.setup{max-width:620px;margin:6vh auto;padding:0 16px}
.setup .card{padding:24px}
.hero{font-family:var(--display);font-weight:800;font-size:34px;line-height:1.05;letter-spacing:-.02em}
.typecard{border-top:4px solid var(--c)}

/* chart */
.chart svg{width:100%;height:auto;display:block}
.chart .tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--panel);font-size:12px;padding:6px 8px;border-radius:6px;white-space:nowrap;font-family:var(--mono);transform:translate(-50%,-110%)}
.chart{position:relative}

.lock{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}

@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  #menuBtn{display:inline-flex}
  nav.side{position:fixed;top:0;left:0;bottom:0;width:270px;height:100%;z-index:40;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 40px rgba(0,0,0,.3)}
  nav.side.open{transform:none}
  main{padding:16px 16px 80px}
  .top{gap:6px 8px;padding:8px 12px}
  .brand{order:1;flex:1 1 0;min-width:70px} .brand span{display:none}
  .tools{order:2;display:flex;gap:6px}
  .cashbox{order:3;font-size:14px}
  .clock{order:4;flex-direction:row;align-items:baseline;gap:6px} .clock .d{display:none}
  .clock .t{font-size:17px}
  .speedwrap{order:5;display:flex;gap:6px;align-items:center;margin-left:auto} #clkS{display:none}
  .speed button{min-width:34px;padding:5px 6px}
  #toasts{top:auto;bottom:16px;left:16px;right:16px;max-width:none}
  #modal{padding:0}
  .dlg{border-radius:0;min-height:100%;width:100%!important}
  .dlg .bd{max-height:none}
  h1{font-size:21px}
}
@media (min-width:861px){.speedwrap{display:flex;gap:8px;align-items:center}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

</style>
</head>
<body>
<div id="app">
  <header class="top">
    <button class="iconbtn" id="menuBtn" data-a="menu" aria-label="Open menu"></button>
    <div class="brand"><b id="brandName">Retail Empire Simulator</b><span id="brandSub"></span></div>
    <div class="tools"><button class="iconbtn qbtn" id="qBtn" data-a="queue">Queue</button><button class="iconbtn" id="bellBtn" data-a="bell" aria-label="Notifications"><span class="dot" id="bellDot" style="display:none">0</span></button></div>
    <div class="clock"><span class="t" id="clkT">07:30</span><span class="d" id="clkD"></span></div>
    <div class="speedwrap"><span id="clkS"></span><button class="btn sm" id="skipBtn" data-a="skip" style="display:none">Skip to morning</button>
      <div class="speed" role="group" aria-label="Game speed"><button data-a="speed" data-n="0" aria-label="Pause">❚❚</button><button data-a="speed" data-n="1">1×</button><button data-a="speed" data-n="2">2×</button><button data-a="speed" data-n="4">4×</button></div></div>
    <div class="cashbox" id="cash" title="Company cash">$0.00</div>
  </header>
  <div class="shell"><nav class="side" id="side" aria-label="Screens"></nav><main id="main"></main></div>
</div>
<div id="modal"></div>
<div id="toasts" aria-live="polite"></div>
<script>
/* Retail Empire Simulator: game data and simulation engine (no DOM access). */
(function (G) {
'use strict';

/* ---------- helpers ---------- */
const C = d => Math.round(d * 100);
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function wpick(arr, wf) {
  let t = 0; const ws = [];
  for (const x of arr) { const w = Math.max(0, wf(x) || 0); ws.push(w); t += w; }
  if (t <= 0) return null;
  let r = Math.random() * t;
  for (let i = 0; i < arr.length; i++) { r -= ws[i]; if (r <= 0) return arr[i]; }
  return arr[arr.length - 1];
}
function poisson(l) { if (l <= 0) return 0; const L = Math.exp(-l); let k = 0, p = 1; do { k++; p *= Math.random(); } while (p > L); return k - 1; }

/* ---------- time ---------- */
const DAY = 1440, OPEN = 480, CLOSE = 1260, LAST_ENTRY = 1245, SHUT = 1305;
const BASE = Date.UTC(2026, 10, 1); // Day 1 = Sunday, November 1
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const dayOf = t => Math.floor(t / DAY) + 1;
function dateOf(day) { const d = new Date(BASE + (day - 1) * 864e5); return { y: d.getUTCFullYear() - 2025, m: d.getUTCMonth(), dom: d.getUTCDate(), dow: d.getUTCDay() }; }
function fmtDate(day) { const d = dateOf(day); return `${DOW[d.dow]} ${MON[d.m]} ${d.dom}, Year ${d.y}`; }
function fmtTime(t) { const m = ((t % DAY) + DAY) % DAY; return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); }

/* ---------- world data ---------- */
const LOCS = {
  main:     { id:'main', name:'Main Street', kind:'Neighborhood high street', traffic:1.0, rent:1.0, wealth:1.0, aff:{grocery:1.15,clothing:0.9,toy:0.95,book:1.0}, note:'Steady local foot traffic. Good for everyday shopping.' },
  mall:     { id:'mall', name:'Riverside Mall', kind:'Shopping district', traffic:1.5, rent:1.8, wealth:1.1, aff:{grocery:0.8,clothing:1.4,toy:1.2,book:1.0}, note:'Big weekend crowds and high rent. Fashion does well here.' },
  heights:  { id:'heights', name:'Maple Heights', kind:'Family neighborhood', traffic:1.0, rent:0.85, wealth:1.05, aff:{grocery:1.2,clothing:0.9,toy:1.45,book:1.0}, note:'Young families nearby. Toys and groceries sell well.' },
  univ:     { id:'univ', name:'University Row', kind:'Campus district', traffic:1.2, rent:0.95, wealth:0.8, aff:{grocery:0.95,clothing:1.1,toy:0.7,book:1.5}, note:'Students on tight budgets. Books and textbooks are in demand.' },
  downtown: { id:'downtown', name:'Downtown Square', kind:'City center', traffic:1.35, rent:1.6, wealth:1.25, aff:{grocery:0.9,clothing:1.2,toy:0.9,book:1.2}, note:'Office workers with money to spend. Expensive rent.' },
  harbor:   { id:'harbor', name:'Harbor Plaza', kind:'Waterfront, tourists', traffic:1.1, rent:1.2, wealth:1.3, aff:{grocery:0.85,clothing:1.0,toy:1.15,book:1.1}, note:'Visitors buy gifts. Higher spending per customer.' }
};
const SIZES = {
  small:  { id:'small', label:'Small', cost:1, rent:1, stock:400, eq:1, traffic:1 },
  medium: { id:'medium', label:'Medium', cost:1.8, rent:1.7, stock:700, eq:1.6, traffic:1.45 },
  large:  { id:'large', label:'Large', cost:3, rent:2.6, stock:1100, eq:2.4, traffic:2 }
};

/* Catalogs */
const G_ = (id, name, cat, cost, price, w, o = {}) => ({ id:'g-'+id, name, cat, cost:C(cost), price:C(price), w, life:o.life||null, cold:o.cold||null });
const GROCERY = [
  G_('sourdough','Sourdough loaf','Bakery',1.9,4.49,1.2,{life:3}),
  G_('croissant','Butter croissants (4)','Bakery',2.2,4.99,0.8,{life:2}),
  G_('wheat','Whole wheat bread','Bakery',1.4,3.29,1.4,{life:4}),
  G_('milk','Whole milk, 1 gal','Dairy',2.1,3.99,2.0,{life:7,cold:'fridge'}),
  G_('eggs','Large eggs, dozen','Dairy',1.7,3.49,1.6,{life:14,cold:'fridge'}),
  G_('cheddar','Cheddar block','Dairy',2.6,4.99,0.9,{life:30,cold:'fridge'}),
  G_('yogurt','Greek yogurt (4)','Dairy',3.1,5.49,0.8,{life:12,cold:'fridge'}),
  G_('butter','Salted butter','Dairy',2.4,4.49,0.7,{life:30,cold:'fridge'}),
  G_('banana','Bananas, bunch','Produce',0.7,1.79,1.8,{life:5}),
  G_('apple','Gala apples, 3 lb','Produce',2.2,4.49,1.1,{life:14}),
  G_('tomato','Vine tomatoes','Produce',1.5,3.29,1.0,{life:6}),
  G_('onion','Yellow onions, 3 lb','Produce',1.1,2.79,0.9,{life:30}),

/* Items (sellable variants) built from products */
function itemsOf(type, p) {
  if (type === 'clothing') { const out = []; for (const c of p.colors) for (const s of p.sizes) out.push({ sku:`${p.id}|${c}|${s}`, pid:p.id, label:`${c} · ${s}`, size:s, color:c, cost:p.cost, price:p.price }); return out; }
  if (type === 'book') return Object.keys(p.fmts).map(f => ({ sku:`${p.id}|${f}`, pid:p.id, label:FMT_LABEL[f], fmt:f, cost:p.fmts[f].cost, price:p.fmts[f].price }));
  return [{ sku:p.id, pid:p.id, label:'', cost:p.cost, price:p.price }];
}

/* ---------- state construction ---------- */
function newGame(opts) {

    v: 1, company: opts.company || 'Cornerstone Retail', mode: opts.mode || 'career', cash: opts.cash != null ? opts.cash : C(6000),
    t: 7 * 60 + 30, speed: 1, seq: { id: 1, po: 1001, br: 1 }, branches: [], pos: [], ledger: [], stats: {}, notes: [],
    totals: { served: 0, bestDay: -1e12, revenue: 0 }, goals: {}, market: { hot: null, hotUntil: 0 }, brandUntil: 0, created: Date.now()
  };
  const b = createBranch(S, { type:'grocery', name:opts.storeName || 'Main Street Market', loc:'main', size:'small', starter:true });
  // pre-stocked starter store
  for (const p of TYPES.grocery.catalog) if (b.listed[p.id]) {
    const it = b.items[p.id]; const m = TYPES.grocery.shelfMax[TYPES.grocery.facingOf(p)];
    addBatch(S, it, p, Math.round(m * 0.75), Math.round(m * 0.5), p.cost);

}
function nid(S, p) { return p + (S.seq.id++); }

function createBranch(S, o) {
  const T = TYPES[o.type], sz = SIZES[o.size || 'small'];

    id: 'b' + (S.seq.br++), type: o.type, name: o.name, loc: o.loc, size: sz.id, opened: dayOf(S.t), status: 'open',
    rep: 60, clean: 90, lastTidy: -999, equip: {}, upg: [], depts: o.type === 'grocery' ? [...T.startDepts] : [...T.cats],
    listed: {}, items: {}, markdown: {}, sups: [T.suppliers[0]], supRel: {}, cust: {}, active: [], queue: [], sched: [],
    emps: [], apps: [], camps: [], loyalty: false, preorders: [], returnsDue: [], fitBusy: 0, invested: 0, stockBuyout: 0
  };
  for (const e of T.equip) b.equip[e.id] = 0;
  for (const [k, v] of Object.entries(T.startEquip)) b.equip[k] = Math.max(1, Math.round(v * sz.eq));
  for (const p of T.catalog) for (const it of itemsOf(o.type, p)) {
    const fac = T.facingOf(p);
    b.items[it.sku] = { sku: it.sku, pid: p.id, label: it.label, size: it.size, color: it.color, fmt: it.fmt, price: it.price,
      min: fac === 'fridge' ? 5 : T.defMin, reorder: fac === 'fridge' ? 10 : T.defReorder, batches: [], soldT: 0, missT: 0, soldY: 0, soldAll: 0 };
  }
  // list products by weight until facings are full
  const caps = facings(b); const used = {};
  const sorted = [...T.catalog].sort((a, c) => (c.w || 1) * (c.pop || 50) - (a.w || 1) * (a.pop || 50));
  for (const p of sorted) {
    if (!b.depts.includes(p.cat)) continue;
    if (o.type === 'book' && p.release > dayOf(S.t)) continue;
    if (o.type === 'clothing' && p.season === 'summer') continue;
    const f = T.facingOf(p); used[f] = used[f] || 0;
    if (used[f] < (caps[f] || 0)) { b.listed[p.id] = true; used[f]++; }

}

function facings(b) {
  const T = TYPES[b.type]; const out = {};
  for (const k of Object.keys(T.facings)) out[k] = 0;
  for (const e of T.equip) if (e.fac) for (const [k, v] of Object.entries(e.fac)) out[k] += v * (b.equip[e.id] || 0);
  return out;
}
function facingsUsed(b) {
  const T = TYPES[b.type]; const out = {};
  for (const k of Object.keys(T.facings)) out[k] = 0;
  for (const pid of Object.keys(b.listed)) if (b.listed[pid]) out[T.facingOf(T.pmap[pid])]++;
  return out;
}
const stockCap = b => SIZES[b.size].stock + 300 * (b.equip.stockroom || 0);
const itShelf = it => it.batches.reduce((a, x) => a + x.s, 0);
const itStock = it => it.batches.reduce((a, x) => a + x.r, 0);

function prodOf(b, it) { return TYPES[b.type].pmap[it.pid]; }

function saleOn(S, b) { return b.camps.some(c => c.id === 'sale' && c.until > S.t); }
function effPrice(S, b, it) {

function addBatch(S, it, p, shelf, stock, cost) {

  it.batches.push({ id: S.seq.id++, s: shelf, r: stock, c: cost, exp });

function sortBatches(it) { it.batches.sort((a, c) => (a.exp == null ? 1e9 : a.exp) - (c.exp == null ? 1e9 : c.exp)); }

/* ---------- money & stats ---------- */
function st(S, day, bid) {
  const d = S.stats[day] || (S.stats[day] = {});

}
function cashTx(S, bid, amt, kind, memo) {
  S.cash += amt;
  const s = st(S, dayOf(S.t), bid || 'hq');
  if (amt >= 0) s.cin += amt; else s.cout -= amt;
  S.ledger.push({ id: S.seq.id++, t: S.t, b: bid || null, kind, amt, memo: memo || '', bal: S.cash });
  if (S.ledger.length > 2500) S.ledger.splice(0, S.ledger.length - 2500);
}
function note(S, bid, level, text) {
  S.notes.unshift({ id: S.seq.id++, t: S.t, b: bid, level, text, read: false });
  if (S.notes.length > 80) S.notes.length = 80;
  if (S.onNote) S.onNote(S.notes[0]);
}
const branchOf = (S, id) => S.branches.find(b => b.id === id);

/* ---------- customers ---------- */
function genCustomer(S, b) {
  const T = TYPES[b.type], L = LOCS[b.loc];
  const ty = wpick(T.custTypes, x => x.w * (x.id === 'holiday' ? holidayW(dayOf(S.t)) : 1));
  const c = {
    id: 'c' + (S.seq.id++), name: pick(FIRST) + ' ' + pick(LAST), type: ty.id,
    budget: Math.round(C(rand(ty.budget[0], ty.budget[1])) * L.wealth), tol: ty.tol, patience: randi(ty.patience[0], ty.patience[1]),
    loyalty: randi(5, 35), sat: 70, visits: 0, spent: 0, hist: [], lastVisit: -1e9, since: dayOf(S.t), pay: Math.random() < 0.65 ? 'card' : 'cash', visit: null
  };
  if (b.type === 'grocery') c.prefs = [...ty.prefs].sort(() => Math.random() - 0.5).slice(0, 2);
  if (b.type === 'clothing') {
    c.size = wpick(APP, s => ({ XS:5, S:18, M:30, L:27, XL:15, XXL:5 })[s]); c.shoe = pick(SHOE); c.kid = pick(KID);
    c.color = pick(['Black','White','Blue','Red','Navy','Grey','Indigo','Olive','Ivory','Tan','Brown','Sand']);
    c.brand = pick(['Harlow','Aster','Northline']);

  }

  if (b.type === 'book') {

    c.prefs = ty.id === 'student' ? [pick(['Textbooks','Educational']), pick(gs)] : [pick(gs), pick(gs)];
  }

}
function holidayW(day) { const d = dateOf(day); return d.m === 10 ? 1.5 : d.m === 11 && d.dom <= 24 ? 3 : 0.2; }
function typeLabel(b, c) { const t = TYPES[b.type].custTypes.find(x => x.id === c.type); return t ? t.label : c.type; }
function custType(b, c) { return TYPES[b.type].custTypes.find(x => x.id === c.type); }

function seasonMult(type, day) {
  const d = dateOf(day); let m = 1;
  if (type === 'grocery') { if (d.m === 10 && d.dom >= 22 && d.dom <= 26) m = 1.4; if (d.m === 11 && d.dom >= 18 && d.dom <= 24) m = 1.3; if (d.m === 11 && d.dom === 25) m = 0.3; }
  if (type === 'clothing') { if (d.m === 10 && d.dom === 27) m = 2.0; else if (d.m === 11 && d.dom <= 24) m = 1.4; else if (d.m === 0 && d.dom <= 10) m = 1.3; }
  if (type === 'toy') { if (d.m === 10) m = d.dom >= 20 ? 1.6 : 1.2; else if (d.m === 11 && d.dom <= 24) m = 1.8 + d.dom * 0.04; else if (d.m === 11) m = 0.7; else if (d.m <= 1) m = 0.75; }
  if (type === 'book') { if (d.m === 11 && d.dom <= 24) m = 1.5; else if (d.m === 0 && d.dom <= 15) m = 1.2; else if ((d.m === 7 && d.dom >= 20) || (d.m === 8 && d.dom <= 10)) m = 1.6; }

}
const HOUR = [0,0,0,0,0,0,0,0,0.6,0.8,1.0,1.1,1.35,1.2,0.9,0.9,1.1,1.45,1.4,1.0,0.75,0.5,0,0];
function trafficMult(S, b) {
  let m = 1;

  if (S.brandUntil > S.t) m *= BRAND_CAMPAIGN.mult;
  return m;
}
function arrivalRate(S, b) { // per hour
  const T = TYPES[b.type], L = LOCS[b.loc], day = dayOf(S.t), h = Math.floor((S.t % DAY) / 60);
  let r = T.traffic * SIZES[b.size].traffic * L.traffic * L.aff[b.type] * (0.35 + b.rep / 100) * HOUR[h] * seasonMult(b.type, day) * trafficMult(S, b);
  if (b.type === 'book') r *= 1 + 0.06 * (b.equip.nook || 0);
  if (b.type === 'clothing') r *= 1 + 0.04 * (b.equip.table || 0);
  if (b.type === 'toy' && b.equip.case) r *= 1.05;
  if (b.loyalty) r *= 1.08;

function startVisit(S, b, c, kind, data) {
  const usual = c.pay || 'card', other = usual === 'card' ? 'cash' : 'card';
  c.visit = { method: Math.random() < 0.8 ? usual : other, phase: 'browsing', start: S.t, until: S.t + randi(4, 10), kind: kind || 'shop', basket: [], missed: 0, pricey: 0, alt: 0, pre: 0, data: data || null };
  if (kind === 'return') { c.visit.phase = 'queue'; c.visit.queueSince = S.t; b.queue.push(c.id); }
  b.active.push(c.id);
  st(S, dayOf(S.t), b.id).visits++;
}

function productWeight(S, b, c, p, day) {
  const T = TYPES[b.type], ty = custType(b, c), d = dateOf(day);
  let w = (p.w || 1);
  if (c.prefs && c.prefs.includes(p.cat)) w *= 2.5;
  if (b.type === 'clothing') {
    if (p.season === 'winter') w *= (d.m >= 10 || d.m <= 1) ? 1.8 : d.m >= 5 && d.m <= 7 ? 0.3 : 1;
    if (p.season === 'summer') w *= (d.m >= 10 || d.m <= 1) ? 0.25 : d.m >= 5 && d.m <= 7 ? 1.8 : 1;
    if (ty.id === 'seasonal' && p.season !== 'all') w *= 2.5;
    if (ty.id === 'brand' && p.brand === c.brand) w *= 2.5;
    if (ty.id === 'budget') w *= 1 + (b.markdown[p.id] || 0) / 15;
    if (ty.id === 'trend' && b.camps.some(x => x.id === 'lookbook' && x.until > S.t) && p.season !== 'all') w *= 2;
  }

    w *= pop / 50;
    if (p.season === 'holiday') w *= (d.m === 10 || (d.m === 11 && d.dom <= 24)) ? 2.5 : 0.1;
    if (ty.id === 'collector') w *= p.col ? 8 : 0.2;

    if (b._best && b._best.includes(p.id)) w *= 1.4;

function buildWants(S, b, c) {
  const T = TYPES[b.type], ty = custType(b, c), day = dayOf(S.t);
  let n = randi(ty.items[0], ty.items[1]);
  if (b.type === 'grocery' && b.equip.carts) n = Math.round(n * (1 + 0.08 * b.equip.carts));
  if (b.type === 'toy' && ty.id === 'kid' && Math.random() < 0.5) n++;
  const wants = [], seen = new Set();
  if (c.visit.data && c.visit.data.forced) wants.push(c.visit.data.forced);
  const pool = T.catalog;
  for (let i = 0, guard = 0; i < n && guard < n * 4; guard++) {
    const p = wpick(pool, x => productWeight(S, b, c, x, day));
    if (!p) break; if (seen.has(p.id)) continue; seen.add(p.id); i++;
    const qty = randi(ty.qty[0], ty.qty[1]);
    if (b.type === 'grocery') wants.push({ pid: p.id, opts: [p.id], qty });
    else if (b.type === 'toy') wants.push({ pid: p.id, opts: [p.id], qty, gift: Math.random() < (ty.gift || 0.15) });
    else if (b.type === 'clothing') {
      const size = p.sizes === SHOE ? c.shoe : p.sizes === KID ? c.kid : p.sizes === OS ? 'One size' : (p.sizes.includes(c.size) ? c.size : pick(p.sizes));
      const col = p.colors.includes(c.color) ? c.color : pick(p.colors);
      const opts = [`${p.id}|${col}|${size}`];
      for (const oc of p.colors) if (oc !== col && Math.random() < 0.6) opts.push(`${p.id}|${oc}|${size}`);
      wants.push({ pid: p.id, opts, qty });

      const opts = [`${p.id}|${pref}`]; for (const f of fm) if (f !== pref && ty.id !== 'collector') opts.push(`${p.id}|${f}`);

function takeFromShelf(it, q) {

  return picks;
}
function returnPicks(S, it, picks) {
  for (const pk of picks) {
    const x = it.batches.find(y => y.id === pk.bid);
    if (x) x.s += pk.q; else it.batches.push({ id: S.seq.id++, s: pk.q, r: 0, c: pk.c, exp: pk.exp });
  }
  sortBatches(it);

function finishBrowse(S, b, c) {

  for (const w of wants) {

      if (Math.random() < 0.6 && !b.preorders.some(x => x.cid === c.id && x.pid === w.pid)) { b.preorders.push({ cid: c.id, pid: w.pid, sku: w.opts[0], day }); v.pre++; }
      continue;
    }
    let got = false, wasAvail = false;
    for (let i = 0; i < w.opts.length; i++) {
      const it = b.items[w.opts[i]]; if (!it || !b.listed[it.pid]) continue;
      const sh = itShelf(it); if (sh <= 0) continue;

function tryFit(S, b, c) {

  return false;

function toQueue(S, b, c) { c.visit.phase = 'queue'; c.visit.queueSince = S.t; b.queue.push(c.id); }

function abandon(S, b, c, reason) {

function visitSat(S, b, c, outcome) {

function endVisit(S, b, c, outcome) {

/* ---------- save / load / tab lock ---------- */
function save() {
  if (!S || UI.locked) return;
  try { const o = Object.assign({}, S); delete o.onNote; localStorage.setItem(SAVE_KEY, JSON.stringify(o)); UI.lastSave = Date.now(); UI.dirty = false; UI.saveErr = ''; }
  catch (e) { UI.saveErr = 'Autosave failed: browser storage is unavailable or full. Use Settings & save to copy a save code.'; }
}
function load() {
  try { const raw = localStorage.getItem(SAVE_KEY); if (!raw) return null; const o = JSON.parse(raw); if (o && o.v === 1 && o.branches) return o; } catch (e) {}
  return null;
}
function attach(st) { S = st; S.onNote = n => { if (n.level === 'warn' || n.level === 'good' || /arrived/.test(n.text)) toast(n.text, n.level); }; UI.bid = S.branches[0].id; }
function lockCheck() {
  try {
    const raw = localStorage.getItem(LOCK_KEY); const l = raw ? JSON.parse(raw) : null; const now = Date.now();
    if (l && l.id !== TAB && now - l.ts < 6000) { if (!UI.locked) { UI.locked = true; renderLock(); } return; }
    if (UI.locked) return; // we lost the lock earlier; wait for user to take over
    localStorage.setItem(LOCK_KEY, JSON.stringify({ id: TAB, ts: now }));
  } catch (e) {}
}
function takeOver() { try { localStorage.setItem(LOCK_KEY, JSON.stringify({ id: TAB, ts: Date.now() })); } catch (e) {} UI.locked = false; const st = load(); if (st) attach(st); $('lock') && $('lock').remove(); renderAll(); }
function renderLock() {
  if (S && S.speed) S.speed = 0;
  const d = document.createElement('div'); d.className = 'lock'; d.id = 'lock';
  d.innerHTML = `<div class="card" style="max-width:440px"><h2>This game is open in another tab</h2><p class="muted">Only one tab can run the game at a time, so the clock doesn't advance twice. This tab is paused.</p><button class="btn pri" data-a="takeover">Play in this tab instead</button></div>`;
  document.body.appendChild(d);
}

/* ---------- game loop ---------- */
let acc = 0, last = performance.now(), lastRender = 0;
function loop() {
  const now = performance.now(); const dt = Math.min(1000, now - last); last = now;
  if (S && !UI.locked && S.speed > 0 && !document.hidden) {
    const night = R.isNight(S) && !anyQueue();
    acc += dt / 1000 * S.speed * (night ? 15 : 1);
    let n = Math.floor(acc); acc -= n; n = Math.min(n, 240);
    for (let i = 0; i < n; i++) R.step(S);
    if (n) UI.dirty = true;
    renderTop();
    if (now - lastRender > 900) { lastRender = now; liveRender(); }
  }
  if (S && UI.dirty && Date.now() - UI.lastSave > 10000) save();
}
function anyQueue() { return S.branches.some(b => b.active.length); }
function liveRender() {
  const a = document.activeElement;
  if (a && $('main').contains(a) && /INPUT|SELECT|TEXTAREA/.test(a.tagName)) return;
  if (window.getSelection && String(window.getSelection()).length) return;
  renderMain(); renderNav();
  if (UI.modal && UI.modal.live) renderModal();
}

function alertsFor(b) {
  const out = []; const TT = T(b);
  const q = b.queue.filter(id => b.cust[id].visit.phase === 'queue').length;
  if (q >= 3) out.push(['bad', `${q} customers waiting at checkout`, 'checkout']);
  const arr = S.pos.filter(p => p.bid === b.id && p.status === 'arrived');
  if (arr.length) out.push(['warn', `${arr.length} deliver${arr.length > 1 ? 'ies' : 'y'} waiting to be checked in`, 'deliveries']);
  let empty = 0, low = 0, exp = 0;
  for (const it of Object.values(b.items)) { if (!b.listed[it.pid]) continue; const sh = R.itShelf(it), sk = R.itStock(it); if (sh === 0) empty++; if (sh + sk + R.onOrder(S, b, it.sku) < it.min) low++; for (const x of it.batches) if (x.exp != null && x.exp <= day() && x.s + x.r) exp += x.s + x.r; }
  if (empty) out.push(['bad', `${empty} stock line${empty > 1 ? 's' : ''} with an empty shelf`, 'inventory']);
  if (low) out.push(['warn', `${low} stock line${low > 1 ? 's' : ''} below the reorder point`, 'suppliers']);
  if (exp) out.push(['warn', `${exp} units expire tonight. Lower prices or accept the loss`, 'inventory']);

}

function barChart(days, key, label) {
  const W = 560, H = 150, pl = 54, pb = 22, pt = 10; const vals = days.map(d => d[key]);
  const mx = Math.max(1, ...vals), mn = Math.min(0, ...vals); const span = mx - mn;
  const nice = v => { const p = Math.pow(10, Math.floor(Math.log10(Math.max(1, Math.abs(v))))); return Math.ceil(v / p) * p; };
  const top = nice(mx), bot = mn < 0 ? -nice(-mn) : 0; const y = v => pt + (top - v) / (top - bot) * (H - pt - pb);
  const bw = (W - pl - 8) / days.length;
  let g = '';
  for (const v of [bot, bot < 0 ? 0 : (top / 2), top]) g += `<line x1="${pl}" x2="${W - 4}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pl - 6}" y="${y(v) + 4}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono">${K(v)}</text>`;
  days.forEach((d, i) => {
    const v = d[key], x = pl + i * bw + 1, h = Math.abs(y(v) - y(0)), yy = v >= 0 ? y(v) : y(0);
    const r = Math.min(4, bw / 4, h / 2);
    const path = v >= 0 ? `M${x},${y(0)}V${yy + r}q0,-${r} ${r},-${r}H${x + bw - 2 - r}q${r},0 ${r},${r}V${y(0)}Z` : `M${x},${y(0)}V${yy + h - r}q0,${r} ${r},${r}H${x + bw - 2 - r}q${r},0 ${r},-${r}V${y(0)}Z`;
    g += `<g class="bar" data-tip="Day ${d.d}: ${M(v)}"><rect x="${x - 1}" y="${pt}" width="${bw}" height="${H - pt - pb}" fill="transparent"/>${h > 0.5 ? `<path d="${path}" fill="${v < 0 ? 'var(--bad)' : 'var(--accent)'}"/>` : ''}</g>`;
    if (i % 2 === (days.length - 1) % 2) g += `<text x="${x + bw / 2 - 1}" y="${H - 6}" text-anchor="middle" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono">${d.d}</text>`;
  });
  return `<div class="small muted" style="margin-top:6px">${label}, by day${key === 'net' ? ' (red = loss)' : ''}</div><div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${label} for the last ${days.length} days">${g}</svg></div>`;
}

  return header('Products & pricing', `Choose what goes on display and set prices. Display space: ${Object.keys(f).map(k => `${TT.facings[k].toLowerCase()} ${fu[k]}/${f[k]}`).join(', ')}.`,
    `<select data-c="prodCat" aria-label="Category"><option value="">All categories</option>${TT.cats.map(c => `<option ${UI.prodCat === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select>`) +
  `<div class="tw"><table><thead><tr><th>Product</th><th>Category</th><th class="n">Supplier cost</th><th class="n">Suggested price</th><th>Your price</th>${b.type === 'clothing' ? '<th>Markdown</th>' : ''}<th class="n">Sold, all time</th><th>On display</th></tr></thead><tbody>${prods.map(p => {
    const its = Object.values(b.items).filter(i => i.pid === p.id); const open = b.depts.includes(p.cat); const listed = !!b.listed[p.id]; const sold = its.reduce((a, i) => a + i.soldAll, 0);

    const costs = b.type === 'book' ? its.map(i => M(R.costOf(b, i))).join('<br>') : M(p.cost); const refs = b.type === 'book' ? its.map(i => M(R.refPrice(b, i))).join('<br>') : M(p.price);

    <td>${open ? `<button class="btn sm ${listed ? '' : 'pri'}" data-a="list" data-p="${p.id}" data-on="${listed ? 0 : 1}">${listed ? 'Remove' : 'Put on display'}</button>` : '<span class="small muted">Unlock in Equipment</span>'}</td></tr>`; }).join('')}</tbody></table></div>
  <p class="small muted">Customers compare your price with the suggested price. Budget shoppers walk away from small markups; premium and gift shoppers tolerate more. Removing a product sends its shelf stock back to the stockroom.</p>`;
};

V.suppliers = () => {

    return `<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">${esc(s.name)}</h2>${signed ? '<span class="pill good">Contract signed</span>' : `<span class="pill">Contract ${M(s.contract)}</span>`}</div><p class="small muted" style="margin:4px 0 8px">${esc(s.kind)}${s.cats ? ': ' + s.cats.join(', ') : s.pubs ? ': ' + s.pubs.join(', ') : ''}</p>
    <div class="li small"><span>Prices vs. list</span><b class="num">${Math.round(s.priceIdx * 100)}%${signed && R.supDiscount(b, id) ? ` −${R.supDiscount(b, id) * 100}% loyalty` : ''}</b></div><div class="li small"><span>Delivery time</span><b class="num">about ${dur(s.lead)}</b></div><div class="li small"><span>Delivery fee</span><b class="num">${M(s.fee)}</b></div><div class="li small"><span>Minimum order</span><b class="num">${M(s.minOrder)}</b></div><div class="li small"><span>Reliability</span><span class="row">${meter(s.rel * 100, 100, s.rel < 0.88 ? 'warn' : 'good')}<b class="num">${Math.round(s.rel * 100)}%</b></span></div><div class="li small"><span>Relationship</span><span class="row">${meter(b.supRel[id] || 0, 100)}<b class="num">${b.supRel[id] || 0}</b></span></div>
    <div class="row mt8">${signed ? `<button class="btn pri" data-a="order" data-s="${id}">Create order</button>${sug.length ? `<span class="small muted">${sug.length} line${sug.length > 1 ? 's' : ''} need reordering</span>` : ''}` : `<button class="btn" data-a="sign" data-s="${id}">Sign contract for ${M(s.contract)}</button>`}</div></div>`; }).join('')}</div>
  <p class="small muted mt">Reliability is the chance a delivery arrives complete. Relationship grows with each accepted delivery and earns up to 5% off.</p>`;
};

V.deliveries = () => {
  const b = B(); const mine = S.pos.filter(p => p.bid === b.id);
  const arr = mine.filter(p => p.status === 'arrived'), tr = mine.filter(p => p.status === 'transit'), done = mine.filter(p => p.status !== 'arrived' && p.status !== 'transit').slice(0, 40);
  const sup = id => R.SUPPLIERS[id].name; const units = p => p.lines.reduce((a, l) => a + l.qty, 0);

  `<div class="card"><h2>Waiting to be checked in <span class="num muted">(${arr.length})</span></h2>${arr.length ? arr.map(p => { const short = p.lines.some(l => l.delivered < l.qty || l.dmg); return `<div class="li"><span><b>${p.id}</b> · ${esc(sup(p.sup))}<br><span class="small muted">${units(p)} units ordered · arrived ${ago(p.arrivedAt)}</span></span><span class="row">${short ? '<span class="pill warn">Discrepancies</span>' : '<span class="pill good">Looks complete</span>'}<button class="btn pri" data-a="review" data-p="${p.id}">Review</button></span></div>`; }).join('') : '<div class="empty">Nothing at the back door.</div>'}</div>

  <div class="card mt"><h2>History</h2>${done.length ? `<div class="tw"><table><thead><tr><th>Order</th><th>Supplier</th><th>Status</th><th class="n">Paid</th><th class="n">Credited</th><th>Closed</th><th></th></tr></thead><tbody>${done.map(p => `<tr><td class="num">${p.id}</td><td>${esc(sup(p.sup))}</td><td><span class="pill ${p.status === 'closed' ? 'good' : 'warn'}">${{ closed: 'Received', refused: 'Refused', cancelled: 'Cancelled' }[p.status]}</span>${p.acceptedBy && p.acceptedBy !== 'you' ? ` <span class="small muted">by ${esc(p.acceptedBy)}</span>` : ''}</td><td class="n">${M(p.total)}</td><td class="n">${p.credit ? M(p.credit) : ''}</td><td class="num small">${p.closedAt ? 'Day ' + R.dayOf(p.closedAt) + ' ' + R.fmtTime(p.closedAt) : ''}</td><td><button class="btn sm" data-a="poView" data-p="${p.id}">Details</button></td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">No completed orders yet.</div>'}</div>`;
};

V.customers = () => {

  return header('Customers', `${Object.keys(b.cust).length} people shop at ${esc(b.name)}. Each has a budget, tastes and a memory of how you treated them.`) +
  `<div class="row" style="margin-bottom:10px"><div class="seg" role="group" aria-label="Filter">${[['all', 'Everyone'], ['here', 'In store now'], ['loyal', 'Loyal'], ['unhappy', 'Unhappy']].map(([k, l]) => `<button data-a="custF" data-k="${k}" aria-pressed="${UI.custF === k}">${l}</button>`).join('')}</div><input type="text" data-c="custQ" placeholder="Search by name" value="${esc(UI.custQ)}" aria-label="Search customers"></div>
  <div class="tw"><table><thead><tr><th>Customer</th><th>Type</th><th>Likes</th><th class="n">Visits</th><th class="n">Spent</th><th>Satisfaction</th><th>Loyalty</th><th>Now</th></tr></thead><tbody>${list.slice(0, 150).map(c => `<tr class="click" data-a="cust" data-c="${c.id}"><td><div class="nm">${esc(c.name)}</div><div class="sb num">${c.id.toUpperCase()}</div></td><td class="small">${esc(R.typeLabel(b, c))}</td><td class="small">${esc((c.prefs || []).join(', '))}${c.size ? ' · size ' + c.size : ''}${c.childAge != null && c.childAge < 20 ? ' · child age ' + c.childAge : ''}</td><td class="n">${c.visits}</td><td class="n">${M(c.spent)}</td><td><div class="row" style="gap:6px">${meter(c.sat, 100, c.sat < 45 ? 'bad' : c.sat < 65 ? 'warn' : 'good')}<span class="num small">${c.sat}</span></div></td><td><div class="row" style="gap:6px">${meter(c.loyalty, 100)}<span class="num small">${Math.round(c.loyalty)}</span></div></td><td>${st(c)}</td></tr>`).join('') || '<tr><td colspan="8"><div class="empty">No customers match.</div></td></tr>'}</tbody></table></div>`;

  <div class="card mt"><h2>Applicants</h2><p class="small muted" style="margin-top:0">New applicants every morning. Efficiency improves with each day worked.</p><div class="tw"><table><thead><tr><th>Name</th><th>Role</th><th>What they do</th><th class="n">Wage</th><th class="n">Efficiency</th><th class="n">Reliability</th><th></th></tr></thead><tbody>${b.apps.map(a => `<tr><td><div class="nm">${esc(a.name)}</div><div class="sb">${a.exp} year${a.exp === 1 ? '' : 's'} experience</div></td><td>${R.ROLES[a.role].label}</td><td class="small">${R.ROLES[a.role].desc}</td><td class="n">${M(a.wage)}/h</td><td class="n">${Math.round(a.eff * 100)}%</td><td class="n">${Math.round(a.rel * 100)}%</td><td><button class="btn sm pri" data-a="hire" data-e="${a.id}">Hire</button></td></tr>`).join('') || '<tr><td colspan="7"><div class="empty">No applicants left today.</div></td></tr>'}</tbody></table></div></div>`;
};

V.equipment = () => {

V.marketing = () => {
  const b = B(); const camps = R.CAMPAIGNS.filter(c => !c.type || c.type === b.type);
  const running = b.camps.filter(c => c.until > S.t);
  return header('Marketing', `Campaigns bring more customers in. Traffic right now: about ${R.arrivalRate(S, b).toFixed(0)} customers per hour, and the season is ×${R.seasonMult(b.type, day()).toFixed(2)}.`) +

  <div class="grid g3 mt">${camps.map(c => { const on = b.camps.some(x => x.id === c.id && x.until > S.t); return `<div class="card"><h3>${esc(c.name)}</h3><p class="small muted">${esc(c.desc)}</p><button class="btn pri" data-a="camp" data-c="${c.id}" ${on ? 'disabled' : ''}>${on ? 'Running' : 'Run for ' + M(c.cost)}</button></div>`; }).join('')}
  <div class="card"><h3>Loyalty program</h3><p class="small muted">Permanent. Customers become loyal faster and visit more often (+8% traffic).</p><button class="btn pri" data-a="camp" data-c="loyalty" ${b.loyalty ? 'disabled' : ''}>${b.loyalty ? 'Active' : 'Launch for ' + M(R.LOYALTY_COST)}</button></div>

};

/* ---------- modals ---------- */
function dlg(title, sub, body, foot, cls) { return `<div class="dlg ${cls || ''}" role="dialog" aria-modal="true" aria-labelledby="dlgT"><header><div><h2 id="dlgT">${title}</h2>${sub ? `<p>${sub}</p>` : ''}</div><button class="iconbtn" data-a="close" aria-label="Close">✕</button></header><div class="bd">${body}</div>${foot ? `<footer>${foot}</footer>` : ''}</div>`; }
const MD = {};
MD.serve = m => {
  const b = R.branchOf(S, m.bid), c = b.cust[m.cid];
  if (!c || !c.visit) return dlg('Customer left', '', '<div class="empty">This customer is gone.</div>', '<button class="btn" data-a="close">Close</button>', 'narrow');
  const v = c.visit;
  if (v.kind === 'return') { const r = v.data.ret, it = b.items[r.sku];
    return dlg(`Return: ${esc(c.name)}`, `${esc(R.typeLabel(b, c))} is returning an item bought earlier.`, `<div class="receipt"><div class="ln"><span>${r.qty} × ${esc(R.itemName(b, it))}</span><span>${M(r.unit * r.qty)}</span></div><div class="ln tot"><span>Refund</span><span>${M(r.unit * r.qty)}</span></div></div><p class="small muted">The item goes back into the stockroom at its original cost.</p><div class="err" id="serveErr"></div>`, `<button class="btn" data-a="close">Not now</button><button class="btn pri" data-a="refund">Refund ${M(r.unit * r.qty)}</button>`, 'narrow'); }
  const tot = R.basketTotal(S, b, v, m.wrap);
  const canWrap = b.equip.giftwrap && tot.gifts > 0;
  const method = R.payMethod(c);
  const body = `<div class="receipt">${v.basket.map(l => `<div class="ln"><span>${l.qty} × ${esc(R.itemName(b, b.items[l.sku]))}${l.gift && canWrap ? ' 🎁' : ''}</span><span>${M(l.unit * l.qty)}</span></div>`).join('')}${tot.wrapFee ? `<div class="ln"><span>Gift wrap, ${tot.gifts} item${tot.gifts > 1 ? 's' : ''}</span><span>${M(tot.wrapFee)}</span></div>` : ''}<div class="ln tot"><span>Total</span><span>${M(tot.total)}</span></div></div>
  ${canWrap ? `<label class="row mt8"><input type="checkbox" id="wrapChk" data-c="wrap" ${m.wrap ? 'checked' : ''}> Gift wrap ${tot.gifts} item${tot.gifts > 1 ? 's' : ''} at $3 each</label>` : ''}
  <div class="mt"><span class="pill ${method === 'cash' ? 'warn' : 'info'}">${esc(c.name.split(' ')[0])} is paying by ${method}</span></div>
  ${method === 'cash' ? `<div class="mt"><p style="margin:0 0 6px">${esc(c.name.split(' ')[0])} hands you <span class="pricetag">${M(Math.max(v.tender || 0, tot.total))}</span></p><label class="f">Cash received<input type="number" step="0.01" min="0" id="cashIn" data-c="cashIn" value="" placeholder="0.00" inputmode="decimal"></label><div class="row mt8">${[...new Set([tot.total, Math.max(v.tender || 0, tot.total), Math.ceil(tot.total / 2000) * 2000, Math.ceil(tot.total / 5000) * 5000])].sort((a, z) => a - z).map(x => `<button class="btn sm" data-a="cashQuick" data-v="${x}">${M(x)}</button>`).join('')}</div><p class="mt8" style="margin-bottom:0">Change due: <b class="num" id="changeOut">—</b></p></div>`
  : `<p class="mt">${esc(c.name.split(' ')[0])} taps their card. Confirm once the terminal approves.</p>`}<div class="err" id="serveErr"></div>`;
  return dlg(`Checkout: ${esc(c.name)}`, `${esc(R.typeLabel(b, c))} · waited ${S.t - v.queueSince} min · ${tot.items} item${tot.items > 1 ? 's' : ''}`, body, `<button class="btn" data-a="close">Put back in line</button><button class="btn pri big" data-a="pay">${method === 'cash' ? 'Complete cash sale' : 'Confirm card payment'}</button>`, 'narrow');
};
MD.order = m => {
  const b = R.branchOf(S, m.bid), s = R.SUPPLIERS[m.sup], TT = T(b);
  const items = R.supItems(b, m.sup).filter(it => !m.cat || TT.pmap[it.pid].cat === m.cat).filter(it => !m.onlyListed || b.listed[it.pid]);
  const groups = {}; for (const it of items) (groups[it.pid] = groups[it.pid] || []).push(it);
  const body = `<div class="row" style="margin-bottom:10px"><button class="btn" data-a="orderSuggest">Fill in suggested quantities</button><button class="btn" data-a="orderClear">Clear</button><select data-c="orderCat" aria-label="Category"><option value="">All categories</option>${[...new Set(R.supItems(b, m.sup).map(i => TT.pmap[i.pid].cat))].map(c => `<option ${m.cat === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select><label class="row small"><input type="checkbox" data-c="orderListed" ${m.onlyListed ? 'checked' : ''}> Only products on display</label></div>

function renderModal() {

  importSave() { try { const o = JSON.parse(decodeURIComponent(escape(atob($('importBox').value.trim())))); if (!o || o.v !== 1 || !o.branches) throw 0; attach(o); save(); UI.view = 'hq'; renderAll(); toast('Save loaded.', 'good'); } catch (e) { toast('That save code could not be read. Check you pasted all of it.', 'bad'); } },
